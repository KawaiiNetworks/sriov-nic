# Example configuration for one mlx5 SF-backed hardware vDPA device.
# Copy this to sf-nic.conf.<name> in the project directory. The boot service
# restores sriov-nic.conf* PF/VF settings first, then all sf-nic.conf* files.

# Stable SF identity. Dynamic names such as auxiliary/mlx5_core.sf.8,
# devlink port 32768, and /dev/vhost-vdpa-0 must never be saved here.
PF_PCI=0000:03:00.0
SF_CONTROLLER=0
SF_NUM=0

# SF MAC policy:
#   none                - do not set a MAC; this SF cannot be attached to a VM
#   pf-oui-invert-one   - preserve PF octets 1-3, invert only octet 4,
#                         preserve octet 5, and use SF_NUM as octet 6
#   generated           - use SF_PREFIX plus SF_NUM as octet 6
#   explicit            - use the complete SF_MAC below
# Option 2 deliberately differs from VF option 2, which inverts octets 4 and 5.
SF_MAC_MODE=pf-oui-invert-one
SF_PREFIX=
# SF_MAC is recomputed for derived modes; it is retained here for explicit mode
# and as an audit value in files generated by the interactive manager.
SF_MAC=

# Stable logical vDPA name, queue-pair count, and MTU.
# Empty VDPA_NAME/REP_NAME values are filled deterministically by the manager.
VDPA_NAME=
VDPA_MAX_VQP=4
VDPA_MTU=1500
REP_NAME=

# Optional Proxmox VM assignment. The VM must be stopped when attaching or
# detaching. The manager writes only an exact, identifiable args fragment.
PVE_VMID=
