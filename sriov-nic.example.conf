# Operating mode:
#   sriov     - ordinary SR-IOV; works with i40e devices such as Intel XXV710
#   switchdev - devlink e-switch switchdev mode; requires driver/hardware support
MODE=sriov

# Full PCI address of the physical function and number of VFs to create.
PF_PCI=0000:03:00.0
TOTAL_VFS=8

# MAC policy:
#   none              - do not set PF/VF MACs (recommended default)
#   pf-oui-invert     - preserve PF octets 1-3, bitwise-invert octets 4/5,
#                       then append the VF number as octet 6 (deterministic)
#   generated         - assign VF_PREFIX:00, :01, ... to all VFs
#   move-pf-to-vf0    - move the PF permanent MAC to VF 0 and give the PF
#                       VF_PREFIX:00 (the original repository behavior)
# pf-oui-invert derives VF_PREFIX from the PF permanent MAC on every run.
# Legacy pf-oui-random config values are accepted as an alias for this mode.
MAC_MODE=none
VF_PREFIX=02:00:00:03:00

# Optional tuning. "auto" enables these in switchdev mode and disables them
# in ordinary SR-IOV mode.
SET_MAX_RING=true
BRING_REPRESENTORS_UP=auto
ENABLE_HW_TC_OFFLOAD=auto

# Driver/e-switch-specific switchdev settings:
#   recommended - select the built-in per-driver profile
#   auto        - leave the current driver/e-switch value unchanged
# Built-in profiles:
#   mlx5 ConnectX-5/6/7: try SMFS, fall back to the current runtime mode when
#                         unsupported; leave inline mode unchanged
#   Intel ice:            leave steering and inline mode unchanged
FLOW_STEERING_MODE=recommended
INLINE_MODE=recommended
ENCAP_MODE=auto

# Enable global OVS hardware offload before applying boot configurations.
# Only useful for a switchdev/OVS setup.
OVS_HW_OFFLOAD=false
